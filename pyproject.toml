[project]
name = "tourism-backend"
version = "0.1.0"
description = "Crimea Travel Platform modular monolith backend"
readme = "README.md"
authors = [
    { name = "Crimea Travel Platform" },
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "geoalchemy2>=0.20.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
tourism-backend = "tourism_backend.main:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "A",      # flake8-builtins
    "C4",     # comprehensions
    "SIM",    # simplify
    "ASYNC",  # asyncio
    "PT",     # pytest style
    "RET",    # return
    "RSE",    # raise
    "T20",    # no print
]
ignore = [
    "A003",   # class attribute shadowing builtins (id, type, ...) common in models
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501", "T20"]
"tests/**" = ["S101", "T20"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["tourism_backend"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["tourism_backend"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
exclude = [".venv", "alembic/versions"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tourism_backend --cov-report=term-missing:skip-covered --cov-fail-under=0"
