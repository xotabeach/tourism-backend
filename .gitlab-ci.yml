# Emergency low-minutes mode (August 2026).
# Pushes do not create pipelines. Build/deploy runs from a developer machine:
#   ./scripts/deploy-production-local.sh
# A registry-only build can still be started explicitly from GitLab → Run pipeline.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - publish

backend-publish-manual:
  stage: publish
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:production" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:production"
  rules:
    - when: manual
      allow_failure: false
