stages:
  - validate
  - build

backend-validate:
  stage: validate
  image: python:3.13-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - ./scripts/validate.sh
    - uv run alembic history
    - test -f Dockerfile

backend-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t tourism-backend:ci .
  rules:
    - if: $CI_COMMIT_BRANCH
