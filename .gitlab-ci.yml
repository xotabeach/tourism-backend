stages:
  - validate
  - build

variables:
  POSTGRES_DB: tourism
  POSTGRES_USER: tourism
  POSTGRES_PASSWORD: local-tourism-password
  DATABASE_URL: postgresql+asyncpg://tourism:local-tourism-password@postgres:5432/tourism
  DATABASE_URL_SYNC: postgresql+psycopg://tourism:local-tourism-password@postgres:5432/tourism
  REDIS_URL: redis://redis:6379/0

backend-validate:
  stage: validate
  image: python:3.13-bookworm
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      for i in $(seq 1 30); do
        uv run python -c "import psycopg; psycopg.connect('postgresql://tourism:local-tourism-password@postgres:5432/tourism').close()" && break
        sleep 2
      done
  script:
    - uv sync --all-extras --dev
    - uv run alembic upgrade head
    - uv run python scripts/seed_crimea.py
    - ./scripts/validate.sh
    - uv run alembic history
    - test -f Dockerfile

# Open-source dependency audit (does not require paid GitLab Dependency Scanning).
backend-pip-audit:
  stage: validate
  image: python:3.13-bookworm
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - uv sync --all-extras --dev
    - uv run pip-audit
  # Fail the pipeline on known vulnerable deps; document exceptions in
  # tourism-platform/docs/security/exceptions/ if a temporary waiver is needed.
  allow_failure: false

# Optional: enable GitLab Secret Detection / SAST templates when the group tier
# provides them. Until confirmed, do not assume paid scanners are available.
# include:
#   - template: Security/Secret-Detection.gitlab-ci.yml
#   - template: Jobs/SAST.gitlab-ci.yml

# Suggested OSS container scan (enable when Trivy is available on runners):
# backend-trivy:
#   stage: build
#   image: aquasec/trivy:latest
#   script:
#     - trivy image --exit-code 1 --severity HIGH,CRITICAL tourism-backend:ci
#   needs: ["backend-image"]
#   allow_failure: false

backend-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t tourism-backend:ci .
  rules:
    - if: $CI_COMMIT_BRANCH
