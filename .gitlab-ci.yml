stages:
  - code-style
  - run-tests
  - build
  - publish
  - deploy
  - mirror

variables:
  APP_ENV: test
  POSTGRES_DB: tourism
  POSTGRES_USER: tourism
  POSTGRES_PASSWORD: local-tourism-password
  DATABASE_URL: postgresql+asyncpg://tourism:local-tourism-password@postgres:5432/tourism
  DATABASE_URL_SYNC: postgresql+psycopg://tourism:local-tourism-password@postgres:5432/tourism
  REDIS_URL: redis://redis:6379/0

backend-code-style:
  stage: code-style
  image: python:3.13-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - uv sync --all-extras --dev
    - uv run -- ruff check .
    - uv run -- ruff format --check .
    - uv run mypy src/tourism_backend
    - test -f Dockerfile

backend-run-tests:
  stage: run-tests
  image: python:3.13-bookworm
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      for i in $(seq 1 30); do
        uv run python -c "import psycopg; psycopg.connect('postgresql://tourism:local-tourism-password@postgres:5432/tourism').close()" && break
        sleep 2
      done
  script:
    - uv sync --all-extras --dev
    - uv run alembic upgrade head
    - uv run python scripts/seed_crimea.py
    - uv run pytest
    - uv run alembic history

# Open-source dependency audit (does not require paid GitLab Dependency Scanning).
backend-pip-audit:
  stage: run-tests
  image: python:3.13-bookworm
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - uv sync --all-extras --dev
    - uv run pip-audit
  # Fail the pipeline on known vulnerable deps; document exceptions in
  # tourism-platform/docs/security/exceptions/ if a temporary waiver is needed.
  allow_failure: false

# Optional: enable GitLab Secret Detection / SAST templates when the group tier
# provides them. Until confirmed, do not assume paid scanners are available.
# include:
#   - template: Security/Secret-Detection.gitlab-ci.yml
#   - template: Jobs/SAST.gitlab-ci.yml

# Suggested OSS container scan (enable when Trivy is available on runners):
# backend-trivy:
#   stage: build
#   image: aquasec/trivy:latest
#   script:
#     - trivy image --exit-code 1 --severity HIGH,CRITICAL tourism-backend:ci
#   needs: ["backend-image"]
#   allow_failure: false

backend-image:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t tourism-backend:ci .
  rules:
    - if: $CI_COMMIT_BRANCH

backend-publish:
  stage: publish
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - backend-code-style
    - backend-run-tests
    - backend-pip-audit
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    # Floating env tips: gamma → :stage, main → :production
    - |
      if [ "$CI_COMMIT_BRANCH" = "gamma" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:stage"
        docker push "$CI_REGISTRY_IMAGE:stage"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:production"
        docker push "$CI_REGISTRY_IMAGE:production"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "gamma"'

# Stage CD environment (gamma). Publishes the stage tip; no remote host yet.
backend-deploy-stage:
  stage: deploy
  image: alpine:3.21
  needs:
    - backend-publish
  script:
    - |
      echo "Stage environment ready: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      echo "Floating tag: $CI_REGISTRY_IMAGE:stage"
      echo "No remote stage host configured — server deploy is production-only."
  environment:
    name: stage
  rules:
    - if: '$CI_COMMIT_BRANCH == "gamma"'

# Production CD environment (main). Only this job SSHes to the remote server.
backend-deploy-production:
  stage: deploy
  image: alpine:3.21
  resource_group: tourism-backend-production
  needs:
    - backend-publish
  before_script:
    - apk add --no-cache bash openssh-client curl
  script:
    - bash scripts/ci-deploy-production.sh "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DEPLOY_SSH_PRIVATE_KEY && $DEPLOY_SSH_HOST && $DEPLOY_SSH_USER && $DEPLOY_SSH_PORT'

# Public GitHub showcase mirror. GitLab remains source of truth.
github-mirror:
  stage: mirror
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/ci-mirror-to-github.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "gamma" && $GITHUB_MIRROR_TOKEN'
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_MIRROR_TOKEN'
  needs:
    - backend-code-style
    - backend-run-tests
    - backend-pip-audit
